#!/usr/sbin/nft -f

flush ruleset

table inet filter {
        chain prerouting {
               type filter hook prerouting priority 0;
		# The next line can block -sF, -sN, -sM, and -sX scans from nmap.
               ct state invalid counter log prefix "Invalid Packets:  " drop

		# The next line can block -sA and -sW scans from nmap
               tcp flags & (fin|syn|rst|ack) != syn ct state new counter log prefix "nmap scans dropped: " drop
      }

	chain input {
		type filter hook input priority 0;

		# accept any localhost traffic
		iif lo accept


		# accept traffic originated from us
		ct state established,related accept

	 	# Activate the following line to block certain IP addresses from SSH. (Use your own IP addresses.)
		# tcp dport 22 ip saddr { 192.168.0.203, 192.168.0.12 } log prefix "Blocked SSH packets: " drop

		# Edit to add any tcp services that you need
		tcp dport { 22, 53 } ct state new accept
		udp dport 53 ct state new accept

		# The next line allows the necessary icmp packets
		ct state new,related,established icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
	
		# The next line allows IGMP packets from your router
                ip protocol igmp accept


		# ICMPv6 packets which must not be dropped, see https://tools.ietf.org/html/rfc4890#section-4.4.1
		meta nfproto ipv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-reply, echo-request, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, 148, 149 } accept
		ip6 saddr fe80::/10 icmpv6 type { 130, 131, 132, 143, 151, 152, 153 } accept

		# Count and drop any other traffic that is not blocked by the prerouting chain
		counter log prefix "Dropped packet: " drop
	}

}
